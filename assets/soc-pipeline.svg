<svg width="1000" height="620" viewBox="0 0 1000 620"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Dark cyber background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050B14"/>
    <stop offset="50%" stop-color="#071522"/>
    <stop offset="100%" stop-color="#03070D"/>
  </linearGradient>

  <!-- Neon glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Small glow -->
  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40"
           patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40"
          fill="none"
          stroke="#123047"
          stroke-width="1"
          opacity="0.45"/>
  </pattern>

  <!-- Moving gradient -->
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
  </linearGradient>

</defs>

<!-- BACKGROUND -->
<rect width="1000" height="620" rx="18" fill="url(#bg)"/>

<!-- GRID -->
<rect width="1000" height="620"
      rx="18"
      fill="url(#grid)"/>

<!-- BORDER -->
<rect x="10" y="10"
      width="980"
      height="600"
      rx="16"
      fill="none"
      stroke="#00D9FF"
      stroke-width="2"
      opacity="0.65"/>

<!-- HEADER -->
<text x="45" y="58"
      fill="#00D9FF"
      font-family="monospace"
      font-size="24"
      font-weight="bold">
  🚨 SOC INVESTIGATION PIPELINE
</text>

<text x="45" y="88"
      fill="#7CFFB2"
      font-family="monospace"
      font-size="13">
  EVIDENCE-DRIVEN SECURITY OPERATIONS
</text>

<!-- STATUS -->
<circle cx="900" cy="50" r="7"
        fill="#00FF88"
        filter="url(#glow)">
  <animate attributeName="opacity"
           values="1;0.25;1"
           dur="1.4s"
           repeatCount="indefinite"/>
</circle>

<text x="915" y="55"
      fill="#00FF88"
      font-family="monospace"
      font-size="12">
  PIPELINE ONLINE
</text>

<!-- PIPELINE LINE -->
<line x1="500" y1="125"
      x2="500" y2="545"
      stroke="#123047"
      stroke-width="4"/>

<!-- MOVING SCAN -->
<rect x="470" y="105"
      width="60"
      height="440"
      fill="url(#scan)"
      opacity="0.12">
  <animate attributeName="y"
           values="105;545;105"
           dur="4s"
           repeatCount="indefinite"/>
</rect>

<!-- ALERT -->
<g>
  <rect x="375" y="115"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#00D9FF"
        stroke-width="2"/>

  <circle cx="400" cy="141"
          r="7"
          fill="#FF3B6B"
          filter="url(#glow)">
    <animate attributeName="r"
             values="7;11;7"
             dur="1.2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="420" y="147"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    ALERT
  </text>
</g>

<!-- TRIAGE -->
<g>
  <rect x="375" y="180"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#00D9FF"
        stroke-width="2"/>

  <circle cx="400" cy="206"
          r="7"
          fill="#00D9FF"/>

  <text x="420" y="212"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    TRIAGE
  </text>
</g>

<!-- EVIDENCE -->
<g>
  <rect x="375" y="245"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#00FF88"
        stroke-width="2"/>

  <circle cx="400" cy="271"
          r="7"
          fill="#00FF88"/>

  <text x="420" y="277"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    EVIDENCE
  </text>
</g>

<!-- CORRELATION -->
<g>
  <rect x="375" y="310"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#A855F7"
        stroke-width="2"/>

  <circle cx="400" cy="336"
          r="7"
          fill="#A855F7"/>

  <text x="420" y="342"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    CORRELATION
  </text>
</g>

<!-- DETECTION -->
<g>
  <rect x="375" y="375"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#FFB000"
        stroke-width="2"/>

  <circle cx="400" cy="401"
          r="7"
          fill="#FFB000"/>

  <text x="420" y="407"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    DETECTION
  </text>
</g>

<!-- RISK -->
<g>
  <rect x="375" y="440"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#FF4D6D"
        stroke-width="2"/>

  <circle cx="400" cy="466"
          r="7"
          fill="#FF4D6D"/>

  <text x="420" y="472"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    RISK REVIEW
  </text>
</g>

<!-- RESPONSE -->
<g>
  <rect x="375" y="505"
        width="250"
        height="52"
        rx="8"
        fill="#091D2B"
        stroke="#00FF88"
        stroke-width="2"
        filter="url(#glow)"/>

  <circle cx="400" cy="531"
          r="7"
          fill="#00FF88"/>

  <text x="420" y="537"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="16"
        font-weight="bold">
    RESPONSE
  </text>
</g>

<!-- FLOW PARTICLE -->
<circle cx="500" cy="120"
        r="5"
        fill="#00D9FF"
        filter="url(#glow)">

  <animate attributeName="cy"
           values="125;545;125"
           dur="5s"
           repeatCount="indefinite"/>

  <animate attributeName="opacity"
           values="1;0.2;1"
           dur="5s"
           repeatCount="indefinite"/>

</circle>

<!-- SIDE TELEMETRY -->
<text x="70" y="150"
      fill="#536B7A"
      font-family="monospace"
      font-size="11">
  TELEMETRY
</text>

<text x="70" y="180"
      fill="#00D9FF"
      font-family="monospace"
      font-size="11">
  LOGS
</text>

<text x="70" y="205"
      fill="#00FF88"
      font-family="monospace"
      font-size="11">
  NETWORK
</text>

<text x="70" y="230"
      fill="#A855F7"
      font-family="monospace"
      font-size="11">
  AUTHENTICATION
</text>

<text x="70" y="255"
      fill="#FFB000"
      font-family="monospace"
      font-size="11">
  ENDPOINT
</text>

<!-- RIGHT TELEMETRY -->
<text x="745" y="150"
      fill="#536B7A"
      font-family="monospace"
      font-size="11">
  ANALYST ENGINE
</text>

<text x="745" y="180"
      fill="#00D9FF"
      font-family="monospace"
      font-size="11">
  SIEM
</text>

<text x="745" y="205"
      fill="#00FF88"
      font-family="monospace"
      font-size="11">
  IOC ANALYSIS
</text>

<text x="745" y="230"
      fill="#A855F7"
      font-family="monospace"
      font-size="11">
  THREAT HUNTING
</text>

<text x="745" y="255"
      fill="#FF4D6D"
      font-family="monospace"
      font-size="11">
  INCIDENT RESPONSE
</text>

<!-- FOOTER -->
<text x="500" y="590"
      text-anchor="middle"
      fill="#607D8B"
      font-family="monospace"
      font-size="11">
  INVESTIGATE • CORRELATE • DETECT • RESPOND
</text>

</svg>
